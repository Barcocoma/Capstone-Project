version: "3.9"

services:
  app:
    build: .
    container_name: cemetery_app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_NAME: cemetery_management
      DB_PORT: 3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: cemetery_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cemetery_management
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

