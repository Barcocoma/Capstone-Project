services:
  app:
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    container_name: cemetery_app
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_NAME: cemetery_management
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: cemetery_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cemetery_management
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - type: bind
        source: ./Cemetery Management System Database.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db_data:
